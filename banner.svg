<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400">
  <defs>
    <style>
      .bg { fill: #050000; }
      .text-main { 
        font-family: 'Courier New', monospace; 
        font-size: 38px; 
        font-weight: 600; 
        fill: #8A0303; 
        text-anchor: middle; 
        dominant-baseline: middle;
        animation: pulse 4s infinite;
      }
      .text-sub {
        font-family: 'Courier New', monospace; 
        font-size: 20px; 
        font-weight: bold; 
        fill: #4A0000; 
        text-anchor: middle; 
        dominant-baseline: middle;
        animation: blink 2s infinite;
      }
      .badge-bg { fill: #000000; stroke: #4A0000; stroke-width: 1.5; rx: 4; }
      .badge-text { font-family: monospace; font-size: 13px; font-weight: bold; fill: #7A0000; text-anchor: middle; dominant-baseline: central; }
      
      @keyframes pulse {
        0% { opacity: 1; }
        50% { opacity: 0.6; }
        100% { opacity: 1; }
      }
      @keyframes blink {
        0%, 100% { opacity: 0; }
        50% { opacity: 1; }
      }
    </style>
  </defs>

  <!-- Background Keseluruhan -->
  <rect width="100%" height="100%" class="bg" />

  <!-- Animasi Teks Utama -->
  <text x="400" y="160" class="text-main">novascript.site</text>
  <text x="400" y="210" class="text-sub">...</text>

  <!-- Badge JavaScript -->
  <g transform="translate(290, 280)">
    <rect width="100" height="28" class="badge-bg" />
    <text x="50" y="14" class="badge-text">JavaScript</text>
  </g>

  <!-- Badge Lua -->
  <g transform="translate(410, 280)">
    <rect width="100" height="28" class="badge-bg" />
    <text x="50" y="14" class="badge-text">Lua</text>
  </g>
</svg>
